name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos que se pisen entre sí
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 está deprecado en GitHub Actions; 22 coincide con la
          # versión usada localmente para generar package-lock.json.
          node-version: "22"

      - name: Instalar dependencias
        run: |
          set +e
          OUTPUT=$(npm ci 2>&1)
          CODE=$?
          echo "$OUTPUT"
          if [ $CODE -ne 0 ]; then
            # Publica las últimas líneas como anotación pública del check run,
            # legible sin permisos de admin (a diferencia del log completo),
            # para poder diagnosticar el fallo real de npm ci.
            TAIL=$(echo "$OUTPUT" | tail -c 900 | tr '\n' ' ' | tr '%' '_')
            echo "::error::npm ci exit $CODE :: $TAIL"
            exit $CODE
          fi

      - name: Construir sitio estático
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # Red de seguridad: garantiza .nojekyll aunque Next no copie
      # archivos ocultos de public/ al exportar.
      - name: Evitar procesamiento Jekyll
        run: touch ./out/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
